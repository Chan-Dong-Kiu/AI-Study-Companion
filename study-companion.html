<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCompass — AI Study Companion (Prototype)</title>
<style>
  :root {
    --bg: #f7f5f2;
    --bg-elevated: #ffffff;
    --text: #1f2320;
    --text-dim: #5b625d;
    --border: #e2ddd4;
    --accent: #3f6b4f;
    --accent-soft: #e7f0e9;
    --accent-text: #ffffff;
    --warn-soft: #fbf1e2;
    --warn-text: #8a5a1f;
    --pill: #efeae2;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16191a;
      --bg-elevated: #1f2422;
      --text: #ecefec;
      --text-dim: #a3aba5;
      --border: #33403a;
      --accent: #6fae82;
      --accent-soft: #223229;
      --accent-text: #0f1a13;
      --warn-soft: #33291a;
      --warn-text: #e0b579;
      --pill: #262d2a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16191a;
    --bg-elevated: #1f2422;
    --text: #ecefec;
    --text-dim: #a3aba5;
    --border: #33403a;
    --accent: #6fae82;
    --accent-soft: #223229;
    --accent-text: #0f1a13;
    --warn-soft: #33291a;
    --warn-text: #e0b579;
    --pill: #262d2a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span.mark { color: var(--accent); }
  .tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 2px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  nav.tabs {
    display: flex;
    gap: 6px;
    background: var(--pill);
    padding: 4px;
    border-radius: 999px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  nav.tabs button {
    border: none;
    background: transparent;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text-dim);
    font-weight: 500;
  }
  nav.tabs button.active {
    background: var(--bg-elevated);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  select, textarea, input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    resize: vertical;
  }
  select:focus, textarea:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { margin-bottom: 14px; }
  .btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
  }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  .hint-item {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 14px;
    margin-bottom: 14px;
  }
  .hint-round {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .reply-item {
    background: var(--pill);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 6px 0 18px 14px;
    font-size: 0.88rem;
    color: var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .nudge {
    background: var(--warn-soft);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-top: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .thinking {
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.9rem;
  }
  .question-box {
    font-size: 1.02rem;
    line-height: 1.5;
  }
  .meta-pill {
    display: inline-block;
    background: var(--pill);
    color: var(--text-dim);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .solution-box {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 0.95rem;
  }
  .empty-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
    padding: 30px 10px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin: 14px 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .stat {
    background: var(--pill);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .num { font-size: 1.4rem; font-weight: 700; }
  .stat .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .reflection-text {
    line-height: 1.6;
    font-size: 0.98rem;
  }
  .banner {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.82rem;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
  }
  footer.note {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="mark">Study</span>Compass</h1>
      <div class="tagline">Hints before answers. Reflection before judgment.</div>
    </div>
    <nav class="tabs">
      <button id="tab-session" class="active">Study Session</button>
      <button id="tab-reflection">Weekly Reflection</button>
    </nav>
  </header>

  <div id="capability-banner" class="banner" style="display:none;"></div>

  <div id="view-session"></div>
  <div id="view-reflection" style="display:none;"></div>

  <footer class="note">Prototype — hints, verification, and reflections are generated live by Claude on your account.</footer>
</div>

<script>
(function () {
  "use strict";

  const LOG_KEY = "studyCompanionLog_v1";
  const SUBJECTS = ["Intro to Programming", "Data Structures", "Calculus", "Probability & Statistics", "Other"];

  let sampleFn = null;
  let sampleState = "pending"; // pending | ready | unavailable

  const els = {
    banner: document.getElementById("capability-banner"),
    session: document.getElementById("view-session"),
    reflection: document.getElementById("view-reflection"),
    tabSession: document.getElementById("tab-session"),
    tabReflection: document.getElementById("tab-reflection"),
  };

  els.tabSession.onclick = () => switchTab("session");
  els.tabReflection.onclick = () => switchTab("reflection");

  function switchTab(name) {
    els.tabSession.classList.toggle("active", name === "session");
    els.tabReflection.classList.toggle("active", name === "reflection");
    els.session.style.display = name === "session" ? "block" : "none";
    els.reflection.style.display = name === "reflection" ? "block" : "none";
    if (name === "reflection") renderReflection();
  }

  // ---------- storage ----------
  function loadLog() {
    try {
      const raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveLog(log) {
    try {
      localStorage.setItem(LOG_KEY, JSON.stringify(log));
    } catch (e) { /* ignore */ }
  }
  function appendRecord(rec) {
    const log = loadLog();
    log.push(rec);
    saveLog(log);
  }
  function subjectHistory(subject) {
    return loadLog().filter(r => r.subject === subject);
  }

  // ---------- capability setup ----------
  async function initSample() {
    if (!window.claude || typeof window.claude.use !== "function") {
      sampleState = "unavailable";
      showBanner("Live AI hints aren't available in this view. The interface below still shows how the flow works.");
      render();
      return;
    }
    try {
      sampleFn = await window.claude.use("sample");
    } catch (e) {
      sampleFn = null;
    }
    if (!sampleFn) {
      sampleState = "unavailable";
      showBanner("Live AI hints aren't available in this view. The interface below still shows how the flow works.");
    } else {
      sampleState = "ready";
    }
    render();
  }

  function showBanner(text) {
    els.banner.style.display = "block";
    els.banner.textContent = text;
  }
  function hideBanner() {
    els.banner.style.display = "none";
  }

  async function callSample(input, opts) {
    if (!sampleFn) throw { code: "not_granted", message: "Sampling not available" };
    try {
      return await sampleFn(input, opts || {});
    } catch (e) {
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared")) {
        sampleState = "unavailable";
        showBanner("AI access was declined or is unavailable, so live hints can't run right now.");
        render();
      }
      throw e;
    }
  }
  async function callSampleJson(input, opts) {
    if (!sampleFn) throw { code: "not_granted", message: "Sampling not available" };
    try {
      return await sampleFn.json(input, opts || {});
    } catch (e) {
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared")) {
        sampleState = "unavailable";
        showBanner("AI access was declined or is unavailable, so live hints can't run right now.");
        render();
      }
      throw e;
    }
  }

  // ---------- session state machine ----------
  // stage: "compose" | "hinting" | "revealed"
  let session = null;

  function newSession() {
    session = {
      stage: "compose",
      subject: SUBJECTS[0],
      question: "",
      round: 0,
      hints: [],          // {round, text}
      replies: [],         // {round, text, genuine}
      questionType: null,
      pendingNudge: false,
      busy: false,
      solution: null,
      classificationDone: false,
    };
    render();
  }
  newSession();

  function scaffoldingNote(subject) {
    const hist = subjectHistory(subject).slice(-3);
    if (hist.length < 2) return "";
    const avgRounds = hist.reduce((a, r) => a + (r.hintRounds || 0), 0) / hist.length;
    if (avgRounds > 0 && avgRounds <= 1.5) {
      return "The student has recently needed very few hints in this subject — keep this hint minimal and high-level, even more so than usual.";
    }
    return "";
  }

  async function startSession() {
    const qBox = document.getElementById("question-input");
    const subjSel = document.getElementById("subject-select");
    const text = qBox.value.trim();
    if (!text) return;
    session.question = text;
    session.subject = subjSel.value;
    session.stage = "hinting";
    session.round = 1;
    session.busy = true;
    render();

    // classify question type (non-blocking best-effort)
    try {
      const cls = await callSampleJson(
        `Classify the following student question into exactly one category: "Solve" (wants the direct answer), "Explain" (wants a concept explained), or "Verify" (wants their own attempt checked).\n\nQuestion: """${text}"""\n\nReply with only a JSON object like {"category":"Solve"}.`,
        { modelTier: "quick", cache: false }
      );
      session.questionType = (cls && cls.category) ? cls.category : "Unclassified";
    } catch (e) {
      session.questionType = "Unclassified";
    }
    session.classificationDone = true;

    await generateHint();
  }

  function historyBlock() {
    let s = "";
    for (let i = 0; i < session.hints.length; i++) {
      s += `Hint round ${session.hints[i].round}: "${session.hints[i].text}"\n`;
      const reply = session.replies.find(r => r.round === session.hints[i].round);
      if (reply) s += `Student's reply: "${reply.text}"\n`;
    }
    return s;
  }

  async function generateHint() {
    session.busy = true;
    render();
    const note = scaffoldingNote(session.subject);
    const prompt = `You are a Socratic tutor for a first- or second-year Computer Science / Engineering student, subject: ${session.subject}.
Never give away the final answer or solve the problem outright. Give exactly ONE short guiding question or minimal directional hint appropriate to hint round ${session.round} (round 1 = gentle nudge, higher rounds = progressively more specific, but still never the full solution).
${note ? note + "\n" : ""}
Student's original question: """${session.question}"""

${historyBlock()}
Give hint round ${session.round} now. Reply with ONLY the hint text (1-3 sentences), no preamble, no labels.`;

    let candidateHint = "";
    try {
      const res = await callSample(prompt, { modelTier: "default", cache: false });
      candidateHint = res.text.trim();
    } catch (e) {
      session.busy = false;
      render();
      return;
    }

    // verification pass
    let finalHint = candidateHint;
    try {
      const verifyPrompt = `You are reviewing a hint before it is shown to a student, to catch errors or ambiguity.
Question: """${session.question}"""
Candidate hint: """${candidateHint}"""

If the hint is accurate and genuinely leads toward the correct solution, return it unchanged. If it contains an error or could mislead the student, rewrite it so it is correct. Reply with ONLY the final hint text (1-3 sentences), no preamble.`;
      const res2 = await callSample(verifyPrompt, { modelTier: "quick", cache: false });
      finalHint = res2.text.trim();
    } catch (e) {
      // fall back to unverified candidate if verification pass fails
      finalHint = candidateHint;
    }

    session.hints.push({ round: session.round, text: finalHint });
    session.busy = false;
    render();
  }

  async function submitReply() {
    const box = document.getElementById("reply-input");
    const text = box.value.trim();
    if (!text) return;
    session.busy = true;
    session.pendingNudge = false;
    render();

    let genuine = true;
    try {
      const judged = await callSampleJson(
        `A student was given a hint and asked to share their own thinking before the next hint. Judge whether this reply shows genuine engagement (an attempt, a guess, a specific question, or an honest "I don't know where to start" WITH some context) versus a low-effort non-answer (like "ok", "next", "idk" alone, or near-empty text).\n\nStudent's reply: """${text}"""\n\nReply with only a JSON object like {"genuine": true}.`,
        { modelTier: "quick", cache: false }
      );
      genuine = !!(judged && judged.genuine);
    } catch (e) {
      genuine = true; // fail open so a demo hiccup doesn't block the student
    }

    session.replies.push({ round: session.round, text, genuine });

    if (!genuine) {
      session.pendingNudge = true;
      session.busy = false;
      render();
      return;
    }

    box.value = "";
    session.round += 1;
    await generateHint();
  }

  async function revealSolution() {
    session.busy = true;
    render();
    try {
      const res = await callSample(
        `Give the complete, correct, step-by-step solution to this problem for a first/second-year CS/Engineering student. Be thorough and correct.\n\nQuestion: """${session.question}"""\n\nWrite the full solution now.`,
        { modelTier: "complex", cache: false }
      );
      session.solution = res.text.trim();
    } catch (e) {
      session.solution = "The full solution couldn't be generated right now — try again in a moment.";
    }
    session.stage = "revealed";
    session.busy = false;
    logSession(true);
    render();
  }

  function finishWithoutReveal() {
    logSession(false);
    newSession();
  }

  function logSession(revealed) {
    const genuineCount = session.replies.filter(r => r.genuine).length;
    const lowEffortCount = session.replies.filter(r => !r.genuine).length;
    appendRecord({
      timestamp: new Date().toISOString(),
      subject: session.subject,
      questionType: session.questionType || "Unclassified",
      hintRounds: session.hints.length,
      genuineReplies: genuineCount,
      lowEffortReplies: lowEffortCount,
      revealed: revealed,
    });
  }

  // ---------- rendering: session view ----------
  function render() {
    if (sampleState === "unavailable") {
      // banner already shown; still render normal UI so the flow is visible
    } else {
      hideBanner();
    }

    if (session.stage === "compose") {
      els.session.innerHTML = `
        <div class="card">
          <div class="row">
            <label>Subject</label>
            <select id="subject-select">
              ${SUBJECTS.map(s => `<option ${s === session.subject ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
          <div class="row">
            <label>Your question</label>
            <textarea id="question-input" rows="4" placeholder="e.g. Why does my recursive function stack overflow on large inputs?"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn" id="start-btn">Start with a hint</button>
          </div>
        </div>
        <div class="empty-state">You'll get a guiding hint first, not the answer — you can ask for the full solution any time.</div>
      `;
      document.getElementById("start-btn").onclick = startSession;
      return;
    }

    // hinting or revealed
    let hintsHtml = session.hints.map(h => {
      const reply = session.replies.find(r => r.round === h.round);
      return `
        <div class="hint-item">
          <div class="hint-round">Hint ${h.round}</div>
          <div>${escapeHtml(h.text)}</div>
        </div>
        ${reply ? `<div class="reply-item">You: ${escapeHtml(reply.text)}${reply.genuine ? "" : " <em>(flagged as low-effort at the time)</em>"}</div>` : ""}
      `;
    }).join("");

    let bottomHtml = "";
    if (session.busy) {
      bottomHtml = `<div class="thinking">Thinking…</div>`;
    } else if (session.stage === "revealed") {
      bottomHtml = `
        <div class="card">
          <div class="meta-pill">Full solution</div>
          <div class="solution-box">${escapeHtml(session.solution || "")}</div>
        </div>
        <div class="btn-row">
          <button class="btn" id="new-question-btn">Ask another question</button>
        </div>
      `;
    } else {
      bottomHtml = `
        <div class="card">
          <label>Before the next hint — what have you tried, or where are you stuck?</label>
          <textarea id="reply-input" rows="3" placeholder="Even a guess or 'I don't know where to start, because...' counts."></textarea>
          ${session.pendingNudge ? `<div class="nudge">That reply reads pretty thin — try describing what you've tried or exactly where you're stuck, in your own words.</div>` : ""}
          <div class="btn-row">
            <button class="btn" id="submit-reply-btn">Submit & get next hint</button>
            <button class="btn secondary" id="reveal-btn">Show full solution instead</button>
          </div>
        </div>
      `;
    }

    els.session.innerHTML = `
      <div class="card">
        <div class="meta-pill">${escapeHtml(session.subject)}${session.questionType ? " · " + session.questionType : ""}</div>
        <div class="question-box">${escapeHtml(session.question)}</div>
      </div>
      ${hintsHtml}
      ${bottomHtml}
    `;

    const submitBtn = document.getElementById("submit-reply-btn");
    if (submitBtn) submitBtn.onclick = submitReply;
    const revealBtn = document.getElementById("reveal-btn");
    if (revealBtn) revealBtn.onclick = revealSolution;
    const newQBtn = document.getElementById("new-question-btn");
    if (newQBtn) newQBtn.onclick = newSession;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  // ---------- reflection view ----------
  async function renderReflection() {
    const log = loadLog();
    const now = Date.now();
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const recent = log.filter(r => now - new Date(r.timestamp).getTime() <= weekMs);

    if (recent.length === 0) {
      els.reflection.innerHTML = `
        <div class="card">
          <div class="empty-state">No study sessions logged in the last 7 days yet. Finish a session in the Study Session tab and it'll show up here.</div>
        </div>
      `;
      return;
    }

    const totalGenuine = recent.reduce((a, r) => a + r.genuineReplies, 0);
    const totalLow = recent.reduce((a, r) => a + r.lowEffortReplies, 0);
    const engagementPct = (totalGenuine + totalLow) > 0 ? Math.round((totalGenuine / (totalGenuine + totalLow)) * 100) : 100;

    const typeCounts = {};
    recent.forEach(r => { typeCounts[r.questionType] = (typeCounts[r.questionType] || 0) + 1; });

    const lateNight = recent.filter(r => {
      const h = new Date(r.timestamp).getHours();
      return h >= 21 || h < 6;
    }).length;
    const lateNightPct = Math.round((lateNight / recent.length) * 100);

    els.reflection.innerHTML = `
      <div class="card">
        <div class="stat-grid">
          <div class="stat"><div class="num">${recent.length}</div><div class="label">Questions this week</div></div>
          <div class="stat"><div class="num">${engagementPct}%</div><div class="label">Genuine engagement</div></div>
          <div class="stat"><div class="num">${lateNightPct}%</div><div class="label">Late-night (9pm–6am)</div></div>
        </div>
        <div class="btn-row">
          <button class="btn" id="gen-reflection-btn">Write my weekly reflection</button>
          <button class="btn secondary" id="clear-log-btn">Clear log</button>
        </div>
        <div id="reflection-output" style="margin-top:16px;"></div>
      </div>
    `;

    document.getElementById("clear-log-btn").onclick = () => {
      saveLog([]);
      renderReflection();
    };

    document.getElementById("gen-reflection-btn").onclick = async () => {
      const out = document.getElementById("reflection-output");
      out.innerHTML = `<div class="thinking">Thinking…</div>`;
      const statsSummary = {
        totalQuestions: recent.length,
        questionTypeBreakdown: typeCounts,
        engagementPct,
        lateNightPct,
        subjects: [...new Set(recent.map(r => r.subject))],
      };
      const prompt = `You write short, warm, non-judgmental weekly reflections for a student about their own AI study-tool usage. Never use words like "addiction", never lecture, never compare to other students, no red flags or alarm language. Phrase observations as open, curious questions the student can sit with, similar in tone to: "Did you notice most of your direct-answer requests happened after 9pm, in Probability?"

Here is this week's usage data (private to the student only): ${JSON.stringify(statsSummary)}

Write a short reflection (4-6 sentences) noticing one or two real patterns in this data, phrased gently and curiously, ending on an encouraging note. Do not just restate the numbers.`;
      try {
        const res = await callSample(prompt, { modelTier: "default", cache: false });
        out.innerHTML = `<div class="reflection-text">${escapeHtml(res.text.trim())}</div>`;
      } catch (e) {
        out.innerHTML = `<div class="empty-state">Couldn't generate the reflection right now.</div>`;
      }
    };
  }

  initSample();
})();
</script>
</body>
</html>
